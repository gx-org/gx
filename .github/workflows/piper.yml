# Run checks on the piper branch to merge with the main branch.

name: Piper

on:
  workflow_dispatch:
  push:
    branches: ["piper"]

env:
  CGO_CFLAGS: -I${{ github.workspace }}/..
  CGO_CPPFLAGS: -I${{ github.workspace }}/..
  CGO_CXXFLAGS: -I${{ github.workspace }}/..
  CGO_LDFLAGS: -labsl_status -labsl_statusor
 
concurrency:
  group: piper-to-main
  cancel-in-progress: false

jobs:

  MergeToMain:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Setup an identity
      run: git config user.email "noreply@github.com" && git config user.name "Github Action"

    - name: Install C++ dependencies
      run: sudo apt-get update && sudo apt-get install -y libabsl-dev

    - name: Checkout the main branch
      run: git checkout -B main origin/main

    - name: Merge piper (the source of truth) into main
      run: git merge -s ours --no-commit origin/piper && git read-tree -u --reset origin/piper

    - name: Remove unsupported code
      run: rm -rf golang/binder/cgx/cgx_test.cc golang/binder/ccgx/cppgx_test.cc golang/binder/pygx

    - name: Tidy (best effort)
      run: go mod tidy || true

    - name: Generating code
      run:  |
        go generate ./...
        git add .

    - name: Tidy (required)
      run: go mod tidy

    - name: Build
      run: |
        go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Commit the merge
      run: git diff --quiet && git diff --staged --quiet || git commit -am 'Update dependencies.'

    - name: Push to main
      run: |
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Trigger Main update on gx-org
      run: gh workflow run "Main update" -R gx-org/gx-org
      env:
        GITHUB_TOKEN: ${{ secrets.GX_ORG_PAT }}
